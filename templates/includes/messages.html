{% if messages %}
<div class="container">
  <div class="messages" role="status">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}">
        <span>{{ message }}</span>
        <button type="button" class="alert-close" aria-label="بستن" data-dismiss>&times;</button>
      </div>
    {% endfor %}
  </div>
</div>
{% endif %}
